<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flip Ball</title>
  <link rel="icon" type="image/svg+xml" href="flip-ball-logo.svg">
  <link rel="stylesheet" href="flip-ball.css">
</head>
<body>

  <div class="app">

    <header class="header">
      <a href="play.html" class="back-btn">←</a>
      <h1>Flip Ball</h1>
      <span class="pts">⭐ <b id="totalPoints">0</b></span>
    </header>

    <section class="hud">
      <div class="hud-box">Score<br><b id="score">0</b></div>
      <div class="hud-box">Time<br><b id="timeLeft">5:00</b></div>
      <div class="hud-box">Circle<br><b id="hoops">0</b></div>
    </section>

    <section class="stage">
      <canvas id="game"></canvas>
    </section>

  </div>

  <!-- Result (sirf 5 minute poore hone par dikhega) -->
  <div class="overlay" id="overlay">
    <div class="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="yellow-btn" id="againBtn">Play Again</button>
      <a href="play.html" class="back-link">Wapas jao</a>
    </div>
  </div>
  

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  
  <script src="firebase-config.js"></script>
  <script src="score.js"></script>
  <script src="flip-sound.js"></script>
  <script src="flip-ball.js"></script>
  <script src="skeleton.js"></script>
</body>
</html>
