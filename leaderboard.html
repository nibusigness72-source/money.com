<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard</title>
  <link rel="stylesheet" href="leaderboard.css">
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <a href="home.html" class="back-btn">←</a>
      <h1>Leaderboard</h1>
    </header>

    <!-- Period Tabs -->
    <section class="period-row">
      <div class="period-tabs">
        <button class="tab">Daily</button>
        <button class="tab">Weekly</button>
        <button class="tab active">Monthly</button>
      </div>
      <button class="calendar-btn">📅</button>
    </section>

    <!-- Top Tabs -->
    <section class="top-tabs">
      <button class="top-tab active">Top 10</button>
      <button class="top-tab">Top 50</button>
      <button class="top-tab">Top 100</button>
    </section>

    <!-- Table Head -->
    <section class="table-head">
      <span class="c-rank">Rank</span>
      <span class="c-player">Player</span>
      <span class="c-points">Points</span>
      <span class="c-reward">Reward</span>
    </section>

    <!-- Leaderboard List (Firebase se bharega) -->
    <section class="list">
      <div class="empty-msg">Load ho raha hai...</div>
    </section>

  </div>

  <!-- 👇 Naya: Apna Rank — hamesha fix, scroll nahi hoga -->
  <div class="my-rank-wrap">
    <div id="myRankBar">
      <span class="my-rank-msg">Load ho raha hai...</span>
    </div>
  </div>

  <!-- Bottom Navigation (home jaisa hi) -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">🎮</span>
      <span>Play</span>
    </a>
    <a href="leaderboard.html" class="nav-item active">
      <span class="icon">🏆</span>
      <span>Leaderboard</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">👥</span>
      <span>Referral</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">⋯</span>
      <span>More</span>
    </a>
  </nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="score.js"></script>

  <script src="script.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
