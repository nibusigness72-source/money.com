<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAY & WIN</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Linked CSS File -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="app-card">
        <!-- Hero Header (Crown Removed) -->
        <div class="hero-header">
            <div class="logo-box">
                <h1 class="logo-text">PLAY & WIN</h1>
                <div class="subtitle">PLAY ◆ EARN ◆ WIN</div>
            </div>
        </div>

        <!-- Controller Stage -->
        <div class="controller-stage">
            <div class="aura-glow"></div>
            <div class="gamepad-card">
                <i class="fa-solid fa-gamepad controller-icon"></i>
            </div>
        </div>

        <!-- Tagline -->
        <div class="tagline-container">
            <h2 class="hindi-headline">खेलो... जीतों...</h2>
            <h3 class="hindi-subhead">अपना भविष्य बनाओ !</h3>
        </div>

        <!-- Feature Cards -->
        <div class="features-row">
            <div class="feature-item">
                <div class="icon-wrap"><i class="fa-solid fa-gamepad"></i></div>
                <span>Free to Play</span>
            </div>
            <div class="feature-item">
                <div class="icon-wrap"><i class="fa-regular fa-clock"></i></div>
                <span>1 Hour Daily<br>Play Limit</span>
            </div>
            <div class="feature-item">
                <div class="icon-wrap"><i class="fa-solid fa-trophy"></i></div>
                <span>Big Prizes</span>
            </div>
            <div class="feature-item">
                <div class="icon-wrap"><i class="fa-solid fa-users"></i></div>
                <span>Refer & Earn</span>
            </div>
        </div>

        <!-- CTA Buttons -->
        <div class="cta-group">
            <button class="btn-signup">Sign Up</button>
            <button class="btn-login">Login</button>
        </div>

        <!-- Footer -->
        <div class="footer-bar">
            <span>All India</span>
            <span class="dot">•</span>
            <span>Play Anywhere</span>
            <span class="dot">•</span>
            <span>Safe & Secure</span>
        </div>
    </div>

</body>
</html>
