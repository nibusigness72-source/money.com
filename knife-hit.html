<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Knife Hit</title>
  <link rel="stylesheet" href="knife-hit.css">
</head>
<body>

  <div class="app">
    <header class="header">
      <a href="play.html" class="back-btn">←</a>
      <h1>Knife Hit</h1>
      <span class="pts">⭐ Best <b id="totalPoints">0</b></span>
    </header>

    <section class="hud">
      <div class="hud-box">Score<br><b id="score">0</b></div>
      <div class="hud-box">Time<br><b id="timeLeft">60</b>s</div>
      <div class="hud-box">Stage<br><b id="stageNo">1</b>/5</div>
    </section>

    <section class="stage">
      <canvas id="game"></canvas>
    </section>
  </div>

  <!-- Start / Result -->
  <div class="overlay show" id="overlay">
    <div class="result">
      <h2 id="resultTitle">🔪 Knife Hit</h2>
      <p id="resultText">Screen par tap karo aur chaku ghoomte circle par maaro. Chaku se chaku takraya to 5 second ruko!</p>
      <button class="yellow-btn" id="againBtn">Start</button>
      <a href="play.html" class="back-link">Wapas jao</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="knife-hit.js"></script>
</body>
</html>
