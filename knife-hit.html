<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knife Hit</title>
  <link rel="stylesheet" href="knife-hit.css">
</head>
<body>

  <div class="app">

    <header class="header">
      <a href="play.html" class="back-btn">←</a>
      <h1>Knife Hit</h1>
      <span class="pts">⭐ <b id="totalPoints">0</b></span>
    </header>

    <section class="hud">
      <div class="hud-box">Score<br><b id="score">0</b></div>
      <div class="hud-box">Time<br><b id="timeLeft">60</b>s</div>
      <div class="hud-box">Stage<br><b id="stage">1</b>/5</div>
      <div class="hud-box">Knives<br><b id="knives">0</b></div>
    </section>

    <section class="stage">
      <canvas id="game"></canvas>
      <div class="popup" id="popup"></div>
    </section>

  </div>

  <!-- Result -->
  <div class="overlay" id="overlay">
    <div class="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="yellow-btn" id="againBtn">Play Again</button>
      <a href="play.html" class="back-link">Wapas jao</a>
    </div>
  </div>
<script src="score.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="sound-knife.js"></script>
  <script src="knife-hit.js"></script>
  <script src="skeleton.js"></script>
</body>
</html>
