<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings & Rules</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <a href="home.html" class="back-btn">←</a>
      <h1>Settings &amp; Rules</h1>
      <a href="payouts.html?tab=pending" id="pendingLink" style="display:none;margin-left:auto;align-items:center;gap:6px;color:#facc15;text-decoration:none;font-weight:700;font-size:13px;border:1px solid #facc15;border-radius:20px;padding:6px 12px;">✎ Pending<span id="pendingCount"></span></a>
    </header>

    <!-- Profile -->
    <section class="profile">
  <label class="profile-avatar" id="profileAvatar" for="photoInput">🧑</label>
      <div class="profile-info">
      <span class="p-name" id="profileName">Nilesh Raj</span>
      <span class="p-id" id="profileId">ID: ------</span>
        <span class="p-level">Level 3</span>
        <div class="xp-row">
          <div class="xp-bar"><div class="xp-fill"></div></div>
          <span class="xp-text">650 / 2,000</span>
        </div>
      </div>
    </section>

    <input type="file" id="photoInput" accept="image/*" hidden>

    <!-- Wallet -->
    <section class="wallet-card">
      <div class="wallet-top">
        <div class="coin">$</div>
        <div class="wallet-info">
          <span class="wallet-label">Your Wallet</span>
          <span class="wallet-amount">₹ 0.00</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="withdraw-btn" id="withdrawBtn" onclick="location.href='payouts.html'" style="background:#facc15;color:#000;border-color:#facc15;">Withdraw</button>
          <button class="withdraw-btn" onclick="location.href='withdraw.html'">change details</button>
        </div>
      </div>
      <div class="wallet-bottom">
        <span>Winnings : <b class="green">₹ 0.00</b></span>
        <span class="divider">|</span>
        <span>Bonus : <b class="green">₹ 0.00</b></span>
      </div>
    </section>

    <!-- Menu List -->
    <section class="menu">
      <a href="#" class="menu-item">
        <span class="m-icon">🔔</span>
        <span class="m-text">Game Rules</span>
        <span class="arrow">›</span>
      </a>
      <a href="#" class="menu-item">
        <span class="m-icon">📄</span>
        <span class="m-text">Terms &amp; Conditions</span>
        <span class="arrow">›</span>
      </a>
      <a href="#" class="menu-item">
        <span class="m-icon">🛡️</span>
        <span class="m-text">Privacy Policy</span>
        <span class="arrow">›</span>
      </a>
      <a href="#" class="menu-item">
        <span class="m-icon">❓</span>
        <span class="m-text">Help &amp; Support</span>
        <span class="arrow">›</span>
      </a>
      <a href="history.html" class="menu-item">
        <span class="m-icon">📜</span>
        <span class="m-text">Game History</span>
        <span class="arrow">›</span>
      </a>
        <a href="wallet-history.html" class="menu-item">
        <span class="m-icon">💰</span>
        <span class="m-text">Wallet History</span>
        <span class="arrow">›</span>
        </a>
    <a href="#" class="menu-item logout" id="logoutBtn">
        <span class="m-icon">⏻</span>
        <span class="m-text">Log Out</span>
        <span class="arrow">›</span>
      </a>
    </section>

    

  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">🎮</span>
      <span>Play</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span class="icon">🏆</span>
      <span>Leaderboard</span>
    </a>
    <a href="referral.html" class="nav-item">
      <span class="icon">👥</span>
      <span>Referral</span>
    </a>
    <a href="settings.html" class="nav-item active">
      <span class="icon">⋯</span>
      <span>More</span>
    </a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
  <script src="profile.js"></script>
  <script src="wallet.js"></script>
  
</body>
</html>
